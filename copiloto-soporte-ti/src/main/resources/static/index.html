<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copiloto Soporte TI - Universidad Continental</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; }
        .navbar-custom { background-color: #002b49; }
        .card-custom { border: none; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .badge-prioridad-Alta { background-color: #dc3545; }
        .badge-prioridad-Media { background-color: #ffc107; color: #000; }
        .badge-prioridad-Baja { background-color: #0d6efd; }
    </style>
</head>
<body>

<!-- BARRA DE NAVEGACIÓN -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
            <i class="bi bi-robot fs-4"></i>
            <span class="fw-bold">Copiloto Soporte TI</span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <span id="nombreUsuarioActivo" class="text-white small fw-semibold"></span>
            <button onclick="cerrarSesion()" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</button>
        </div>
    </div>
</nav>

<div class="container pb-5">

    <!-- VISTA 1: REGISTRAR TICKET (SOLO ESTUDIANTES - IdRol 1) -->
    <div id="vistaEstudiante" class="d-none">
        <div class="card card-custom mx-auto" style="max-width: 750px;">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0 text-primary fw-bold"><i class="bi bi-ticket-perforated"></i> Registrar Nuevo Ticket de Incidencia</h4>
                <p class="text-muted small mb-0">Describe tu problema o requerimiento para el equipo de Soporte TI.</p>
            </div>
            <div class="card-body p-4">
                <form id="ticketForm">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Nombre del Solicitante</label>
                            <input type="text" id="nombreSolicitante" class="form-control bg-light" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Correo Institucional</label>
                            <input type="text" id="correoSolicitante" class="form-control bg-light" readonly>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="titulo" class="form-label fw-semibold">Asunto / Título del Problema *</label>
                        <input type="text" id="titulo" class="form-control" placeholder="Ej. No puedo acceder al Aula Virtual" required>
                    </div>
                    <div class="mb-3">
                        <label for="descripcion" class="form-label fw-semibold">Descripción Detallada *</label>
                        <textarea id="descripcion" class="form-control" rows="4" placeholder="Detalla el problema encontrado..." required></textarea>
                    </div>
                    <div id="mensajeExito" class="alert alert-success d-none mb-3"><i class="bi bi-check-circle"></i> ¡Ticket registrado e ingresado al sistema!</div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold"><i class="bi bi-send"></i> Enviar Incidencia</button>
                </form>
            </div>
        </div>
    </div>

    <!-- VISTA 2: SUPERVISIÓN HUMANA DE SOLUCIONES (ANALISTA Y ADMIN TI - IdRol 2 y 3) -->
    <div id="vistaAdmin" class="d-none">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-dark mb-1"><i class="bi bi-shield-check text-primary"></i> Supervisión Humana de Soluciones</h3>
                <p class="text-muted small mb-0">Revisa y valida las soluciones generadas por el agente de IA antes de enviarlas al estudiante.</p>
            </div>
            <button onclick="cargarTicketsSupervision()" class="btn btn-outline-primary btn-sm"><i class="bi bi-arrow-clockwise"></i> Actualizar Lista</button>
        </div>

        <!-- Contenedor donde se cargarán las tarjetas de supervisión -->
        <div id="listaTicketsSupervision" class="row g-4">
            <!-- Renderizado dinámico desde main.js -->
        </div>
    </div>

</div>

<script src="js/main.js"></script>
</body>
</html>
