<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Soporte TI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card-login { width: 100%; max-width: 400px; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); background: #fff; }
    </style>
</head>
<body>

<div class="card card-login">
    <h3 class="text-center mb-4 text-primary">Copiloto Soporte TI</h3>
    <form id="loginForm">
        <div class="mb-3">
            <label for="correo" class="form-label">Correo Institucional</label>
            <input type="email" id="correo" class="form-control" placeholder="ejemplo@universidad.edu.pe" required>
        </div>
        <div class="mb-3">
            <label for="contrasena" class="form-label">Contraseña</label>
            <input type="password" id="contrasena" class="form-control" placeholder="••••••••" required>
        </div>
        <div id="errorAlert" class="alert alert-danger p-2 small d-none"></div>
        <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
    </form>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const correo = document.getElementById('correo').value;
    const contrasena = document.getElementById('contrasena').value;
    const errorAlert = document.getElementById('errorAlert');

    try {
        const response = await fetch('http://localhost:8080/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ correo, contrasena })
        });

        if (response.ok) {
            const usuario = await response.json();
            // Guardamos el objeto usuario en la sesión del navegador
            localStorage.setItem('usuarioSesion', JSON.stringify(usuario));
            window.location.href = 'index.html';
        } else {
            errorAlert.innerText = "Credenciales incorrectas.";
            errorAlert.classList.remove('d-none');
        }
    } catch (err) {
        errorAlert.innerText = "Error de conexión con el servidor.";
        errorAlert.classList.remove('d-none');
    }
});
</script>
</body>
</html>
